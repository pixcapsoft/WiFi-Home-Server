name: Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Run build script
        run: echo. | Build.bat
        shell: cmd
        
      - name: Create Zip Archive
        run: Compress-Archive -Path dist\* -DestinationPath WiFi-Home-Server-Windows.zip
        
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: WiFi-Home-Server-Windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          pip install pyinstaller customtkinter

      - name: Build with PyInstaller
        run: |
          pyinstaller WiFi-Home-Server.spec

      - name: Create Tar Archive
        run: tar -czvf WiFi-Home-Server-Linux.tar.gz -C dist .

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: WiFi-Home-Server-Linux.tar.gz